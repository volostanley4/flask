{% extends 'base.html' %}
{% block title %} Sales {% endblock %}
{% block content %}
<div>
	<h4>This is the sales page</h4>

	<div>
		<!-- Button trigger modal -->
		<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
			Make Sale
		</button>

		<!-- Modal -->
		<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="exampleModalLabel">Making a sale</h1>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<form method="post" action="/make_sale">
							<div class="mb-3">
								<select class="form-select" aria-label="Default select example" name="pid">
									<option selected>Select a Product</option>
									{% for product in products %}
									<option value="{{ product[0] }}"> {{ product[1] }}</option>
									{% endfor %}
								</select>
							</div>

							<div class="mb-3">
								<label for="exampleInputPassword1" class="form-label">Quantity</label>
								<input type="number" name="quantity" class="form-control" id="exampleInputPassword1">
							</div>

							<div class="mb-3">
								<label for="exampleInputPassword1" class="form-label">Selling price</label>
								<input type="number" name="s_price" class="form-control" id="exampleInputPassword1">
							</div>

							<div class="modal-footer">
								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
								<button type="submit" class="btn btn-primary">Make Sale</button>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>
	</div>

	<table class="table table-stripped table-bordered">
		<thead class="table-dark">
			<tr>
				<th>Sale Id</th>
				<th>PID</th>
				<th>Quantity</th>
				<th>Created At</th>
			</tr>
		</thead>
		<tbody>
			{% for sale in sales %}
			<tr>
				<td>{{ sale[0] }}</td>
				<td>{{ sale[1] }}</td>
				<td>{{ sale[2] }}</td>
				<td>{{ sale[3] }}</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
</div>

</div>
{% endblock %}
